services:
  # Primary Service: FastAPI Server + WebSocket Stream + Live Dashboard + Dummy Agents & Resource Loops
  underworld:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: underworld_sim
    ports:
      - "7788:7788"
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PORT=7788
      - HOST=0.0.0.0
      - UNDERWORLD_API_URL=http://127.0.0.1:7788
    # Bind mounts enable live on-the-fly code manipulation without rebuilding the image
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./configs:/app/configs
      - ./docs:/app/docs
      - ./logs:/app/logs
    # Live reload watches /app/src for instant hot-reloading
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 7788 --reload --reload-dir /app/src
    restart: unless-stopped

  # Orchestrator Service: Runs server + auto-spawns 4 autonomous heuristic agents in background
  underworld-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: underworld_orchestrator
    profiles:
      - orchestrator
    ports:
      - "7788:7788"
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PORT=7788
      - HOST=0.0.0.0
      - UNDERWORLD_API_URL=http://127.0.0.1:7788
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./configs:/app/configs
      - ./docs:/app/docs
      - ./logs:/app/logs
    command: python main.py --no-visualizer --mode simple
    restart: unless-stopped
